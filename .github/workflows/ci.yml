name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: install
        run: pip install -e ".[dev,video]"
      - name: lint (ruff)
        run: ruff check .
      - name: tests (offline — no keys in CI)
        run: pytest -q
