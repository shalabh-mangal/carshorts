[project]
name = "carshorts"
version = "0.1.0"
description = "AI car-Shorts factory — Milestone 1 vertical slice"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
real = ["google-generativeai>=0.7"]
crawl = ["certifi"]
video = ["edge-tts>=6.1", "moviepy>=2.0", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
